name: Build DXC Windows x64

on:
  workflow_dispatch:
    inputs:
      dxc_ref:
        description: "DXC ref (commit/branch/tag)"
        required: true
        default: "b7f344b3fd252ccfd9d237334df828d8f20de4b0"
        type: string
      package_version:
        description: "Package version used in the uploaded file name"
        required: true
        default: "1.9.2609.radray.4"
        type: string

permissions:
  contents: write

jobs:
  build-win-x64:
    name: Build DXC (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DXC (fork)
        uses: actions/checkout@v4
        with:
          repository: ksgfk/DirectXShaderCompiler
          ref: ${{ inputs.dxc_ref || 'b7f344b3fd252ccfd9d237334df828d8f20de4b0' }}
          fetch-depth: 0
          submodules: true
          path: dxc

      - name: Check version and release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: python verify_release.py --source "$env:GITHUB_WORKSPACE/dxc" --version "$env:PACKAGE_VERSION" --platform windows-x64 --repository "$env:GITHUB_REPOSITORY"

      - name: Build
        id: build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]*$') {
            throw "package_version may contain only letters, numbers, dots, underscores, plus signs, and hyphens."
          }
          $zipName = "dxc-windows-x64-$env:PACKAGE_VERSION.zip"
          .\build_win_x64.ps1 -ProjectDir "$env:GITHUB_WORKSPACE\dxc" -Config Release -UseClangCl -ZipName $zipName

      - name: Show artifact path
        if: always()
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
        run: |
          Write-Host "Artifact from build step: $env:ARTIFACT_PATH"

      - name: Validate release asset path
        if: success()
        id: release_asset
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
          DXC_REF: ${{ inputs.dxc_ref }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $artifact = $env:ARTIFACT_PATH
          if ([string]::IsNullOrWhiteSpace($artifact)) {
            throw "Build output 'artifact' is empty."
          }
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Release asset not found: $artifact"
          }

          $normalized = $artifact -replace '\\', '/'
          $manifest = [ordered]@{
            platform = 'windows-x64'
            package_version = $env:PACKAGE_VERSION
            dxc_ref = $env:DXC_REF
            dxc_commit = (git -C "$env:GITHUB_WORKSPACE\dxc" rev-parse HEAD).Trim()
            built_at = (Get-Date).ToUniversalTime().ToString('o')
            asset = Split-Path -Leaf $artifact
            sha256 = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/dxc-windows-x64-$env:PACKAGE_VERSION.manifest.json"
          $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8

          "asset_path=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$($manifestPath -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish rolling GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DXC Autobuild (Latest)
          body: |
            Rolling DXC build artifacts. Published platform/version assets are immutable.
            See the adjacent platform manifest for the DXC ref, resolved commit, and build time.
          files: |
            ${{ steps.release_asset.outputs.asset_path }}
            ${{ steps.release_asset.outputs.manifest_path }}
          overwrite_files: false
          generate_release_notes: false

      - name: Upload artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxc-windows-x64
          path: artifacts/
          retention-days: 1
