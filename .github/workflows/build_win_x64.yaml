name: Build DXC Windows x64

on:
  workflow_dispatch:
    inputs:
      dxc_ref:
        description: "DXC ref (branch/tag)"
        required: true
        default: "codex/radray-dxc-1.9.2607"
        type: string

permissions:
  contents: write

jobs:
  build-win-x64:
    name: Build DXC (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DXC (fork)
        uses: actions/checkout@v4
        with:
          repository: ksgfk/DirectXShaderCompiler
          ref: ${{ inputs.dxc_ref || 'codex/radray-dxc-1.9.2607' }}
          fetch-depth: 0
          submodules: true
          path: dxc

      - name: Build
        id: build
        shell: pwsh
        run: |
          .\build_win_x64.ps1 -ProjectDir "$env:GITHUB_WORKSPACE\dxc" -Config Release

      - name: Show artifact path
        if: always()
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
        run: |
          Write-Host "Artifact from build step: $env:ARTIFACT_PATH"

      - name: Validate release asset path
        if: success()
        id: release_asset
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
          DXC_REF: ${{ inputs.dxc_ref }}
        run: |
          $artifact = $env:ARTIFACT_PATH
          if ([string]::IsNullOrWhiteSpace($artifact)) {
            throw "Build output 'artifact' is empty."
          }
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Release asset not found: $artifact"
          }

          $normalized = $artifact -replace '\\', '/'
          $manifest = [ordered]@{
            platform = 'windows-x64'
            dxc_ref = $env:DXC_REF
            dxc_commit = (git -C "$env:GITHUB_WORKSPACE\dxc" rev-parse HEAD).Trim()
            built_at = (Get-Date).ToUniversalTime().ToString('o')
            asset = Split-Path -Leaf $artifact
          }
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/dxc-windows-x64.manifest.json'
          $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8

          "asset_path=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$($manifestPath -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish rolling GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DXC Autobuild (Latest)
          body: |
            Rolling DXC build artifacts. Each platform asset is replaced by its latest successful build.
            See the adjacent platform manifest for the DXC ref, resolved commit, and build time.
          files: |
            ${{ steps.release_asset.outputs.asset_path }}
            ${{ steps.release_asset.outputs.manifest_path }}
          overwrite_files: true
          generate_release_notes: false

      - name: Upload artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxc-windows-x64
          path: artifacts/dxc-Release
          retention-days: 1
