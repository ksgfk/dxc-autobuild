name: Build DXC macOS arm64

on:
  workflow_dispatch:
    inputs:
      dxc_ref:
        description: "DXC ref (branch/tag)"
        required: true
        default: "codex/radray-dxc-1.9.2607"
        type: string
      package_version:
        description: "Package version used in the uploaded file name"
        required: true
        default: "1.9.2607.radray.1"
        type: string

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build DXC (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DXC (fork)
        uses: actions/checkout@v4
        with:
          repository: ksgfk/DirectXShaderCompiler
          ref: ${{ inputs.dxc_ref || 'codex/radray-dxc-1.9.2607' }}
          fetch-depth: 0
          submodules: true
          path: dxc

      - name: Build
        id: build
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ ! "${PACKAGE_VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._+\-]*$ ]]; then
            echo "package_version may contain only letters, numbers, dots, underscores, plus signs, and hyphens." >&2
            exit 1
          fi
          zip_name="dxc-macos-arm64-${PACKAGE_VERSION}.zip"
          bash ./build_macos_arm64.sh --project-dir "$GITHUB_WORKSPACE/dxc" --config Release --zip-name "${zip_name}"

      - name: Show artifact path
        if: always()
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
        run: |
          echo "Artifact from build step: ${ARTIFACT_PATH}"

      - name: Validate release asset path
        if: success()
        id: release_asset
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact }}
          DXC_REF: ${{ inputs.dxc_ref }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          artifact="${ARTIFACT_PATH}"
          if [[ -z "${artifact}" ]]; then
            echo "Build output 'artifact' is empty." >&2
            exit 1
          fi
          if [[ ! -f "${artifact}" ]]; then
            echo "Release asset not found: ${artifact}" >&2
            exit 1
          fi

          normalized="${artifact//\\//}"
          manifest_path="${GITHUB_WORKSPACE}/artifacts/dxc-macos-arm64-${PACKAGE_VERSION}.manifest.json"
          dxc_commit="$(git -C "${GITHUB_WORKSPACE}/dxc" rev-parse HEAD)"
          jq -n \
            --arg platform 'macos-arm64' \
            --arg package_version "${PACKAGE_VERSION}" \
            --arg dxc_ref "${DXC_REF}" \
            --arg dxc_commit "${dxc_commit}" \
            --arg built_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg asset "$(basename "${artifact}")" \
            '{platform: $platform, package_version: $package_version, dxc_ref: $dxc_ref, dxc_commit: $dxc_commit, built_at: $built_at, asset: $asset}' \
            > "${manifest_path}"

          echo "asset_path=${normalized}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"

      - name: Publish rolling GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DXC Autobuild (Latest)
          body: |
            Rolling DXC build artifacts. Each platform asset is replaced by its latest successful build.
            See the adjacent platform manifest for the DXC ref, resolved commit, and build time.
          files: |
            ${{ steps.release_asset.outputs.asset_path }}
            ${{ steps.release_asset.outputs.manifest_path }}
          overwrite_files: true
          generate_release_notes: false

      - name: Upload artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxc-macos-arm64
          path: artifacts/dxc-Release
          retention-days: 1
